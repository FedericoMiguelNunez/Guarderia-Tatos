[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  publish = "dist"
  functions = "netlify/functions"
  port = 8888
  autoLaunch = false

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
